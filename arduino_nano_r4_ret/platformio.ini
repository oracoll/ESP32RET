[platformio]
default_envs = uno_r4_minima

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino

lib_deps =
    arduino-libraries/Arduino_CAN @ ^0.2.0
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    adafruit/Adafruit NeoPixel @ ^1.11.0
    arduino-libraries/SD @ ^1.2.4

build_flags =
    -D ARDUINO_NANO_R4
